[project]
name = "cricket-chatbot"
version = "0.1.0"
description = "Live cricket commentary chatbot: FastAPI + Ollama + Chroma"
authors = [
    { name = "Wasimkhan", email = "42935472+wasimkhan100@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.4",
    "strands-agents>=1.61.1",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
cricket-chatbot = "cricket_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
